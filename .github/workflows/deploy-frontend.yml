name: Deploy Frontend to EKS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER_NAME: expense-dashboard-capstone
  FRONTEND_ECR_REPOSITORY: capstone-frontend
  K8S_NAMESPACE: expense-dashboard
  AWS_ROLE_TO_ASSUME: arn:aws:iam::180294218913:role/github-actions-expense-tracker-deploy

jobs:
  build-scan-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC claims
        uses: github/actions-oidc-debugger@v1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS account ID
        id: aws-account
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Compose image URI
        id: image
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          IMAGE_URI="${{ steps.aws-account.outputs.account_id }}.dkr.ecr.${AWS_REGION}.amazonaws.com/${FRONTEND_ECR_REPOSITORY}:${IMAGE_TAG}"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Resolve Kubernetes namespace
        id: namespace
        run: |
          NAMESPACE="${K8S_NAMESPACE:-default}"
          echo "value=$NAMESPACE" >> "$GITHUB_OUTPUT"

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: docker build -f frontend/Dockerfile -t "${{ steps.image.outputs.image_uri }}" .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image_uri }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Push image to ECR
        run: docker push "${{ steps.image.outputs.image_uri }}"

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Apply manifests and update image
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/expense-frontend-deployment.yaml -n "${{ steps.namespace.outputs.value }}"
          kubectl apply -f k8s/expense-frontend-service.yaml -n "${{ steps.namespace.outputs.value }}"
          kubectl apply -f k8s/expense-ingress.yaml -n "${{ steps.namespace.outputs.value }}"
          kubectl set image deployment/expense-frontend expense-frontend="${{ steps.image.outputs.image_uri }}" -n "${{ steps.namespace.outputs.value }}"

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/expense-frontend -n "${{ steps.namespace.outputs.value }}" --timeout=300s || {
            kubectl get all -n "${{ steps.namespace.outputs.value }}";
            kubectl describe deployment/expense-frontend -n "${{ steps.namespace.outputs.value }}";
            kubectl describe pods -l app=expense-frontend -n "${{ steps.namespace.outputs.value }}";
            kubectl logs -l app=expense-frontend -n "${{ steps.namespace.outputs.value }}" --tail=200 || true;
            exit 1;
          }
          kubectl get pods -l app=expense-frontend -n "${{ steps.namespace.outputs.value }}"
