server {
    listen 80;

    # Landing page at /
    location = / {
        root /usr/share/nginx/html/landing;
        try_files /landing.html =404;
    }

    # Redirect /app to the SPA entrypoint and serve client-side routes under /app/.
    location = /app {
        return 301 /app/;
    }

    # React SPA at /app/ (^~ so this wins over the regex asset cache block)
    location ^~ /app/ {
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;
    }

    # API proxy
    location /api/ {
        proxy_pass http://expense-api:4000/api/;
    }
}
